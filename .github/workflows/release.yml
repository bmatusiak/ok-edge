# THE RELEASE: firmware hex -> Android app (the hex inside) + desktop app (Windows, Linux) -> web app -> a GitHub
# prerelease + the cloudflare-pre-release branch, or a GitHub release + the cloudflare branch (the published site).
#
# WHEN IT RUNS (the `on:` block below): every push to main is tested (the gate); a push that bumps app.json's version
# also builds and publishes that version's PRE-RELEASE; a published RELEASE is by hand only, from the Actions tab
# ("Run workflow") or with
#     gh workflow run release.yml -f kind=release     # the GitHub release + the cloudflare branch (the published site)
#     gh workflow run release.yml -f kind=build       # build everything, publish nothing (artifacts only)
#
# THE ORDER IS BRAD'S ("the first thing the workflow needs to build is the firmware, then the apk ... one day i want to
# have the firmware flashed from the phone app, so i want the apk to have the latest firmware hex before it is built";
# then "1 firmware, 2 testing and apk, 3 desktop + webapp"; then "the test should be its own run, start after firmware
# build and gate the publish step, so firmware, apk, webapp are built and ready while the test is running"):
# Two lines from the start of the run; when both are good, the build line completes with publish (Brad, 2026-10-28:
# "at the end the 2 lines are good, then the build line can complete the publish"):
#
#   test line:   gate ----------------------------------------------------.
#                                                                          | both good
#   build line:  firmware (build, check the hex) -> android -----------.
#                                                 -> desktop (windows) -+-> webapp -> publish
#                                                 -> desktop (linux) ---'
#
#   either line fails -> the run is cancelled: the other line stops, publish never runs
#
#   1. firmware - the developer-key hexes, from the sources main's firmware/manifest.json records (tools/firmware.js):
#                 PROD (no debug console) and TEST (DANGEROUS-..., the debug console the kit drives - it prints key data).
#                 GitHub builds production releases; the firmware is the one exception that also gives a test build
#                 (Brad, 2026-10-28), and the test hex goes to the GitHub release ALONE - never into the APK or onto the
#                 web app ("hard to accidentally install, not directly pointed at from the apps"). The PROD hex is
#                 CHECKED before any app takes it in (Brad: "not limit us to checking the hex after its build before
#                 it's included in the apps"; "that check is only for the prod release firmware build"): the record is
#                 the build of the sources, the code ends below the plugin flash (build-hardkey.sh's size guard), the
#                 hex carries its build stamp - and the firmware size check, once its limits are set, joins them here.
#                 A prod hex that fails a check is never uploaded.
#      gate     - THE TEST LINE, from the start of the run on a runner of its own: a soft key from the same sources
#                 must pass the kit's 00-sanity, 01-protocol, 07-lib, 08-plugins; the long test, so it holds back only publish
#   then, on the build line:
#      android  - the APK, that hex in its assets (developer_firmware/), by channel (EXPO_PUBLIC_OKEDGE_CHANNEL, below):
#                 a pre-release is com.okedge.debug signed with the repo debug keystore; a release is com.okedge, built
#                 unsigned and signed by red-key's RSA3 over the remote MCP - Brad approves it on his desktop and presses
#                 (tools/release/apk-sign; the secret OKEDGE_SIGNER, the variable OKEDGE_IDENTITY)
#      desktop  - beside android (Brad, 2026-10-28: "desktop package = go, linux and windows separated packages"): one
#                 package per system - Windows .zip, Linux .tar.gz - each on a runner of that system, the soft key
#                 inside built there from the same recorded sources with the phone's plugins
#                 (tools/release/desktop-package.js)
#        webapp - after android and desktop: the release web app with the hex (docs/firmware), the APK's manifest
#                 (docs/android) and the desktop packages' (docs/desktop), the Worker bundled - the Downloads page
#                 offers them all
#   2. publish  - a pre-release or a release (the trigger's kind), after all of them: the GitHub prerelease or release
#                 (APK, desktop packages, hex, release.json) and the built site committed to its branch -
#                 cloudflare-pre-release or cloudflare; a release is also deployed by `wrangler deploy` when the repo has
#                 CLOUDFLARE_API_TOKEN
# Any fail = stop: a failed job cancels the whole run, so nothing after it starts and nothing beside it goes on - and
# publish needs every job, so nothing is published from sources that fail the kit or a build that failed.
#
# NO BUILDS ON MAIN (Brad: "this will keep our main from having builds"): every build goes to the release and its
# branch. Nothing builds the site but this workflow; Cloudflare deploys each branch on each push to it (its build is wrangler deploy of the branch as it is: the Worker already bundled, no build command).
#
# A VERSION IS PUBLISHED ONCE OF EACH KIND (Brad, 2026-10-28: "we published under 0.0.8, so we need to bump before
# releasing again"): the plan step stops a pre-release when any release or prerelease names app.json's version, and a
# release when v<version> is out - bump app.json and package.json first. Each branch is the record of what it published:
# its commits start with the tag, v<version>-<code> (a pre-release) or v<version> (a release).

name: release

on:
  # TWO KINDS OF RELEASE (Brad, 2026-11-04: "the version bump trigger will be the pre-release"; a published release "by
  # hand"; "put it into cloudflare-pre-release"):
  #   a push to main whose app.json version no release or prerelease has yet -> a PRE-RELEASE, built and published by
  #     itself: a GitHub prerelease (tag v<version>-<code>) and the cloudflare-pre-release branch - a site of its own.
  #     A failed one publishes nothing, so the next push tries again. Any other push is tested only (the gate).
  #   by hand, kind=release -> a PUBLISHED RELEASE: a GitHub release (tag v<version>) and the cloudflare branch - the
  #     published site, the one every app's update notice reads. Refused when that version is already released.
  #   by hand, kind=prerelease -> a pre-release of main's version (refused when it has one); kind=build -> artifacts only.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        description: build (artifacts only) | prerelease (GitHub prerelease + cloudflare-pre-release) | release (GitHub release + cloudflare)
        type: choice
        options: [build, prerelease, release]
        default: build

# NOT ONE RUN AT A TIME: only the publish job is (its own concurrency, below - two publishes would race for the tag and
# the branch). A whole-workflow queue kept a newer run waiting behind an older test-only one (Brad,
# 2026-10-30: "the test gate is 17m 24s, can we cancel the old run and start the one that publishes") - the trigger
# job now cancels older test-only runs itself.

permissions:
  contents: write
  # a failed job cancels the run (gh run cancel)
  actions: write

env:
  NODE_VERSION: 24
  # THE CHANNEL (modules/okedge-native/app.plugin.js, src/channel.ts), one variable read by Gradle and inlined by Metro: a
  # published release (by hand, kind=release) is the release channel - com.okedge, signed by red-key's RSA3, its update
  # notices from the published site; every other run builds the debug channel - com.okedge.debug ("OnlyKey DEBUG"), the
  # repo debug keystore, its update notices from the pre-release site
  EXPO_PUBLIC_OKEDGE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.kind == 'release' && 'release' || 'debug' }}

jobs:
  # WHETHER THE BUILD LINE RUNS, AND WHAT IT PUBLISHES (kind: '' builds nothing, build = artifacts only, prerelease,
  # release): by hand, the kind asked; by a push, prerelease when app.json's version has no release or prerelease yet,
  # else nothing. What is out is GitHub's own list of releases - a version is taken once any release names it. The
  # test gate does not wait for this - it runs on every push.
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.v.outputs.go }}
      kind: ${{ steps.v.outputs.kind }}
      # the commit the build line builds and publishes: the pushed one (or, by hand, the one started on)
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge
          fetch-depth: 0
      - name: What does this run build and publish?
        id: v
        working-directory: ok-edge
        env:
          EVENT: ${{ github.event_name }}
          KIND_INPUT: ${{ inputs.kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "started by hand on ${GITHUB_SHA:0:7}: kind=${KIND_INPUT:-build}"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "kind=${KIND_INPUT:-build}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(node -p "require('./app.json').expo.version")
          # every release and prerelease tag names its version: v<version> (a release) or v<version>-<code> (a prerelease)
          taken=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -cE "^v${now//./\\.}(-[0-9]+)?$" || true)
          if [ "$taken" = 0 ]; then
            echo "main is $now, which no release or prerelease has: the build line builds the $now pre-release from ${GITHUB_SHA:0:7}"
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "$now is out already: the test gate only, on ${GITHUB_SHA:0:7} - nothing is built"
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "kind=" >> "$GITHUB_OUTPUT"
          fi
      # NEWER WINS (Brad, 2026-10-30: "can the workflow cancel the other runs automatically"): an older run on this
      # branch gives way to this one, which tests - and, while the version is unpublished, builds - a newer commit. The
      # one exception is a run whose publish job has started: it finishes (its tag and the cloudflare branch), and this
      # run's plan step then sees the version published.
      - name: Older runs give way
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in queued in_progress; do
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$GITHUB_REF_NAME" --status "$status" --json databaseId --jq '.[].databaseId'); do
              [ "$id" -lt "$GITHUB_RUN_ID" ] || continue
              pub=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[] | select(.name=="publish") | .status')
              if [ "$pub" = in_progress ] || [ "$pub" = completed ]; then continue; fi
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" && echo "older run $id cancelled: run $GITHUB_RUN_ID tests ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
            done
          done

  firmware:
    needs: trigger
    if: needs.trigger.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      # the release commit, for the jobs after (they need this job, not the trigger)
      ref: ${{ needs.trigger.outputs.ref }}
      emulator: ${{ steps.plan.outputs.emulator }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # fetch-depth 0: the APK's versionCode is 1000 + main's commit count (modules/okedge-native/app.plugin.js)
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge
          # the release commit (the version bump), not the push's latest
          ref: ${{ needs.trigger.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan - the recorded emulator commit, the version, the tag
        id: plan
        working-directory: ok-edge
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.trigger.outputs.kind }}
        run: |
          emulator=$(node -p "require('./firmware/manifest.json').emulatorCommit || ''")
          [ -n "$emulator" ] || { echo "::error::firmware/manifest.json has no emulatorCommit - run tools/firmware.js build"; exit 1; }
          version=$(node -p "require('./app.json').expo.version")
          [ "$version" = "$(node -p "require('./package.json').version")" ] || { echo "::error::app.json's version $version is not package.json's"; exit 1; }
          code=$((1000 + $(git rev-list --count HEAD)))
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
          v=${version//./\\.}
          # A VERSION IS PUBLISHED ONCE OF EACH KIND: a pre-release only while nothing names the version (a run that failed
          # before publish tries again on the next push), a release only while no release does (its tag: v<version>)
          case "$KIND" in
            prerelease)
              ! echo "$tags" | grep -qE "^v$v(-[0-9]+)?$" || { echo "::error::$version is out already - bump app.json and package.json first"; exit 1; }
              tag="v$version-$code" ;;
            release)
              ! echo "$tags" | grep -qx "v$version" || { echo "::error::$version is already released - bump app.json and package.json first"; exit 1; }
              tag="v$version" ;;
            *) tag="v$version-$code" ;;
          esac
          echo "emulator=$emulator" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "${KIND:-build} $tag from main $(git rev-parse --short HEAD), firmware from emulator ${emulator:0:7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Firmware sources
        uses: ./ok-edge/.github/actions/firmware-sources
        with:
          emulator_ref: ${{ steps.plan.outputs.emulator }}

      # build-hardkey.sh reads Intel HEX with its lib/flash.js (no packages needed for that)
      - name: Checkout the test kit
        uses: actions/checkout@v5
        with:
          repository: bm-ok/onlykey-testing
          path: onlykey-testing

      # the record must be the build of these sources, or the hex would claim a test it never had
      - name: The record is the build of the recorded sources
        run: node ok-edge/tools/firmware.js check

      - name: Build the toolchain image
        run: docker build --quiet -t onlykey/onlykey-firmware-toolchain arduino-1.6.5-r5-teensy_127

      - name: Build the hex
        run: node ok-edge/tools/firmware.js ci-build --out out --src "$GITHUB_WORKSPACE" --kit onlykey-testing

      - name: Upload the firmware
        uses: actions/upload-artifact@v5
        with:
          name: firmware
          path: out/firmware/
          if-no-files-found: error

      # ANY FAIL = STOP (Brad, 2026-10-27: "the gate stops matrix 2 ... any fail = stop"): needs: keeps every later
      # job from starting, but a failed job does not stop the one running beside it - so the run is cancelled, and
      # the other jobs of its stage end with it. Not under act (no run to cancel).
      - name: Stop the run - this job failed
        if: failure() && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # THE TEST GATE (Brad, 2026-10-27: "test gate with 01 protocol", then "00-sanity too"; the pattern is
  # onlykey-firmware-builds' latest.yml): a soft key built from the SAME sources as the hex - the v3.1.0 recipe, its
  # fixes, the hex's plugins, DEBUG on as on the hex - must pass the kit's 00-sanity and 01-protocol. THE TEST LINE: it
  # needs nothing from the build line (it builds its own soft key from the record's sources), so it starts with the run
  # and only publish waits for it (Brad, 2026-10-28: "we can start the test same time as firmware build, if we do the
  # firmware check after ... 2 lines, test line and build line; if any one of the lines fail, then stop the other"). A
  # failure cancels the run, the build line with it. The quick checks of the hex itself end the firmware job, on the
  # build line, before the apps take the hex in.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # from the record itself, as the firmware job reads it - so the test line starts with the run, not after the hex
      - name: The recorded emulator commit
        id: rec
        working-directory: ok-edge
        run: |
          emulator=$(node -p "require('./firmware/manifest.json').emulatorCommit || ''")
          [ -n "$emulator" ] || { echo "::error::firmware/manifest.json has no emulatorCommit"; exit 1; }
          echo "emulator=$emulator" >> "$GITHUB_OUTPUT"

      - name: Firmware sources
        uses: ./ok-edge/.github/actions/firmware-sources
        with:
          emulator_ref: ${{ steps.rec.outputs.emulator }}

      - name: Checkout the test kit
        uses: actions/checkout@v5
        with:
          repository: bm-ok/onlykey-testing
          path: onlykey-testing

      # The emulator maps the key's flash at its real, low addresses; Linux's default vm.mmap_min_addr (65536)
      # forbids that, crypto then segfaults and most of 01-protocol SKIPS while the run still exits 0
      - name: Let the emulator map low addresses
        # sudo only when needed: a host already set (the box, rehearsing under act -self-hosted) has no sudo to give
        run: '[ "$(sysctl -n vm.mmap_min_addr)" -le 4096 ] || sudo sysctl -w vm.mmap_min_addr=4096'

      - name: Build the soft key from the same sources
        working-directory: node-onlykey-emulator/emulator
        env:
          JOBS: max
          OKEMU_VERSION: v3.1.0
          OKEMU_PLUGINS: edge,ctap_bridge,vendor_bridge,derive_secret,version_control
          OKEMU_DEBUG: 1
        run: npm run rebuild

      # the plugins' tests check the firmware against the lib that talks to it - the one ok-edge pins (the kit's own
      # pinned copy is older: no keySite); the kit loads it through OKT_LIB_DIR (lib/plugin-ctx.js)
      - name: Checkout the lib ok-edge pins
        run: |
          pin=$(node -p "require('./ok-edge/package.json').dependencies['node-onlykey-lib'].split('#')[1]")
          git clone --quiet https://github.com/bmatusiak/node-onlykey-lib
          git -C node-onlykey-lib checkout --quiet --detach "$pin"
          (cd node-onlykey-lib && npm ci --ignore-scripts --no-audit --no-fund)

      # the kit ignores its lock file on purpose; a plain install from package.json
      - name: Install the test kit
        working-directory: onlykey-testing
        run: npm install --no-audit --no-fund

      # the firmware protocol (01), the lib the apps ship against it (07) and our plugins (08), each a section of its own;
      # the kit runs the files on every core but one (lib/parallel.js)
      - name: Test gate - 00-sanity, 01-protocol, 07-lib, 08-plugins
        working-directory: onlykey-testing
        env:
          OKT_LIB_DIR: ${{ github.workspace }}/node-onlykey-lib
        run: |
          node bin/okt.js caps || true
          set -o pipefail
          node bin/okt.js run 00-sanity 01-protocol 07-lib 08-plugins 2>&1 | tee ../okt-gate.log
          END=$(grep -a 'OKT-END' ../okt-gate.log | tail -1)
          { echo '### Test gate (00-sanity, 01-protocol, 07-lib, 08-plugins)'; echo '```'; echo "${END:-no OKT-END line}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # NO FALSE GREEN: exit 0 says only that nothing FAILED. Crypto must have been available, and the skips must
          # stay near the known ones (DEBUG-build webcrypt-policy skips)
          grep -aqE 'yes crypto$' ../okt-gate.log \
            || { echo "::error::the crypto capability was not available - the tests did not really run"; exit 1; }
          SKIPS=$(echo "$END" | sed -nE 's/.*tests=[0-9]+p\/[0-9]+f\/([0-9]+)s.*/\1/p')
          echo "skipped: ${SKIPS:-?}"
          [ -n "$SKIPS" ] && [ "$SKIPS" -le 20 ] \
            || { echo "::error::${SKIPS:-unknown} tests skipped - the gate is not trusted"; exit 1; }

      - name: Upload the test gate's logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: okt-gate-${{ github.run_id }}
          path: |
            okt-gate.log
            onlykey-testing/runs/
          if-no-files-found: warn

      # ANY FAIL = STOP (Brad, 2026-10-27: "the gate stops matrix 2 ... any fail = stop"): needs: keeps every later
      # job from starting, but a failed job does not stop the one running beside it - so the run is cancelled, and
      # the other jobs of its stage end with it. Not under act (no run to cancel).
      - name: Stop the run - this job failed
        if: failure() && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  android:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge
          # the release commit (the version bump), not the push's latest
          ref: ${{ needs.firmware.outputs.ref }}
          fetch-depth: 0

      # package.json: "test-moniker": "file:../test-moniker"
      - name: Checkout test-moniker
        uses: actions/checkout@v5
        with:
          repository: bmatusiak/test-moniker
          path: test-moniker

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # the soft key inside the app is built from the same recorded sources as the hex
      - name: Firmware sources
        uses: ./ok-edge/.github/actions/firmware-sources
        with:
          emulator_ref: ${{ needs.firmware.outputs.emulator }}

      # the hex just built, into firmware/ - the Gradle task stageDeveloperFirmware puts it in the APK's assets
      - name: The hexes into firmware/
        uses: actions/download-artifact@v5
        with:
          name: firmware
          path: ok-edge/firmware

      # A RELEASE APK CARRIES THE PROD HEX ONLY (Brad, 2026-10-28: "when github builds, it should do prod-release builds"):
      # the test hex's debug console prints key data, so it is a download of its own, never inside an app
      - name: Only the prod hex for the APK
        working-directory: ok-edge
        run: node tools/firmware.js prod-only firmware

      - name: Install ok-edge's packages
        working-directory: ok-edge
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      - name: Generate android/
        working-directory: ok-edge
        run: npx expo prebuild --platform android --no-install

      # OKEMU_PRODUCTION=1: the soft key's DEBUG console off (it is off by default; said here so no setting can turn it
      # on). No OKRN_DEBUG_LOCK: the debugging lock stays on, as in every production build.
      - name: Build the release APK
        working-directory: ok-edge/android
        env:
          OKEMU_PRODUCTION: 1
        run: ./gradlew assembleRelease --no-daemon

      # A RELEASE IS SIGNED BY RED-KEY'S RSA3 (Brad, 2026-11-04: "the workflow can request signing from my desktop app";
      # "when i do a published release, it will sign using redkey"): Gradle left it unsigned; tools/release/apk-sign
      # records what apksigner signs, asks the key over the remote MCP as the release signer's agent (OKEDGE_SIGNER) -
      # the fingerprints first, Brad approves on his desktop and presses once, then the digests - and replays the
      # signatures; apksigner verify must name the pinned certificate. Up to 30 minutes for the approval; then it fails
      # with nothing signed.
      - name: Sign the release APK with red-key's RSA3 (approved on Brad's desktop)
        if: env.EXPO_PUBLIC_OKEDGE_CHANNEL == 'release'
        working-directory: ok-edge
        env:
          OKEDGE_SIGNER: ${{ secrets.OKEDGE_SIGNER }}
          OKEDGE_IDENTITY: ${{ vars.OKEDGE_IDENTITY }}
          OKEDGE_MCP: ${{ vars.OKEDGE_MCP || 'https://ok-edge.bmatusiak.workers.dev' }}
        run: |
          set -euo pipefail
          [ -n "$OKEDGE_SIGNER" ] || { echo "::error::no OKEDGE_SIGNER secret: the release signer's agent_key (tools/release/apk-sign/sign.js)"; exit 1; }
          [ -n "$OKEDGE_IDENTITY" ] || { echo "::error::no OKEDGE_IDENTITY variable: the identity public key the signer asks"; exit 1; }
          [ -f signing/release.crt.pem ] || { echo "::error::no signing/release.crt.pem: the RSA3 certificate is pinned first"; exit 1; }
          out=android/app/build/outputs/apk/release
          zipalign=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$zipalign" -c 4 "$out/app-release-unsigned.apk"
          node tools/release/apk-sign/sign.js "$out/app-release-unsigned.apk" --out "$out/app-release.apk" --cert signing/release.crt.pem \
            --server "$OKEDGE_MCP" --identity "$OKEDGE_IDENTITY" --minutes 30
          echo "signed by red-key's RSA3: $(node -p "new (require('crypto').X509Certificate)(require('fs').readFileSync('signing/release.crt.pem')).fingerprint256")" >> "$GITHUB_STEP_SUMMARY"

      # WHAT A RELEASE MUST NOT CARRY (ok-rn's tools/release-guards.js, the same three): the soft key's DEBUG console
      # (it prints key bytes), the debugging lock off (a computer could approve and press), the testing screen in the
      # bundle (metro.config.js swaps it for its stub). And the hex the APK carries must be the one just built.
      - name: Release checks
        run: |
          set -euo pipefail
          apk=ok-edge/android/app/build/outputs/apk/release/app-release.apk
          bad=0
          for h in $(find node-onlykey-emulator/emulator/.stage* -path '*libraries/onlykey/onlykey.h'); do
            if grep -qE '^#define DEBUG\s' "$h"; then echo "::error::DEBUG on in $h"; bad=1; fi
          done
          node -e "const f=require('./ok-edge/src/generated/firmware.json'); if (f.debugLock === false) { console.error('the debugging lock is off'); process.exit(1) }" || bad=1
          if unzip -p "$apk" assets/index.android.bundle | grep -qa 'Soft Key firmware'; then echo "::error::the testing screen is in the bundle"; bad=1; fi
          want=$(node -p "require('./ok-edge/firmware/manifest.json').builds[0].file")
          [ "$(unzip -p "$apk" "assets/developer_firmware/$want" | sha256sum | cut -d' ' -f1)" = "$(node -p "require('./ok-edge/firmware/manifest.json').builds[0].sha256")" ] \
            || { echo "::error::the APK does not carry $want as built"; bad=1; }
          if unzip -l "$apk" | grep -q 'developer_firmware/DANGEROUS-'; then echo "::error::the APK carries the test hex"; bad=1; fi
          [ $bad = 0 ]
          echo "release checks: DEBUG off, debugging lock on, no testing screen, the prod hex $want inside (no test hex)" >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK and write its manifest
        env:
          TAG: ${{ needs.firmware.outputs.tag }}
          VERSION: ${{ needs.firmware.outputs.version }}
          CODE: ${{ needs.firmware.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p out
          file="onlykey-edge-$VERSION-$CODE.apk"
          cp ok-edge/android/app/build/outputs/apk/release/app-release.apk "out/$file"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          node ok-edge/tools/release/android-manifest.js --apk "out/$file" --apksigner "$apksigner" --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --version "$VERSION" --version-code "$CODE" --commit "${{ needs.firmware.outputs.ref }}" \
            --app-id "$([ "$EXPO_PUBLIC_OKEDGE_CHANNEL" = release ] && echo com.okedge || echo com.okedge.debug)" \
            --soft-key ok-edge/src/generated/firmware.json --out out/manifest.json

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/
          if-no-files-found: error

      # ANY FAIL = STOP (Brad, 2026-10-27: "the gate stops matrix 2 ... any fail = stop"): needs: keeps every later
      # job from starting, but a failed job does not stop the one running beside it - so the run is cancelled, and
      # the other jobs of its stage end with it. Not under act (no run to cancel).
      - name: Stop the run - this job failed
        if: failure() && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # THE DESKTOP APP, one package per system, each built on a runner of that system (Brad, 2026-10-28: "desktop package =
  # go, linux and windows separated packages"): the soft key's native module and the Node it runs on are that system's,
  # so nothing is cross-built. Beside android, after the firmware job (its plan: the version, the tag, the emulator).
  desktop:
    needs: firmware
    strategy:
      matrix:
        include:
          - { os: windows-latest, platform: win, name: windows }
          - { os: ubuntu-latest, platform: linux, name: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge
          # the release commit (the version bump), not the push's latest
          ref: ${{ needs.firmware.outputs.ref }}

      - name: Checkout test-moniker
        uses: actions/checkout@v5
        with:
          repository: bmatusiak/test-moniker
          path: test-moniker

      # this Node is packaged too: the soft key's native module is built for it (tools/release/desktop-package.js)
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Firmware sources
        uses: ./ok-edge/.github/actions/firmware-sources
        with:
          emulator_ref: ${{ needs.firmware.outputs.emulator }}

      # the phone's soft key - the plugins modules/okedge-native/app.plugin.js builds the APK's with, read from there so
      # the two cannot differ - with no DEBUG console; its build record goes into the app (OKEMU_APP_OUT), where the web
      # export reads which features the soft key has
      - name: Build the soft key from the same sources
        working-directory: node-onlykey-emulator/emulator
        env:
          JOBS: max
          OKEMU_VERSION: v3.1.0
          OKEMU_APP_OUT: ${{ github.workspace }}/ok-edge/src/generated
        run: |
          export OKEMU_PLUGINS=$(node -e "console.log(require('fs').readFileSync('../../ok-edge/modules/okedge-native/app.plugin.js', 'utf8').match(/const PLUGINS = '([^']+)'/)[1])")
          echo "soft key plugins: $OKEMU_PLUGINS"
          npm run rebuild

      # electron-builder fetches the Electron it packages itself
      - name: Install ok-edge's packages
        working-directory: ok-edge
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      - name: Build the web export (release)
        working-directory: ok-edge
        run: npm run build:desktop

      # unsigned (no code-signing certificate yet): Windows says "unknown publisher" the first time it runs
      - name: Package, check and describe it
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          node ok-edge/tools/release/desktop-package.js --platform ${{ matrix.platform }} \
            --emulator node-onlykey-emulator/emulator --out out --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.firmware.outputs.tag }}" --version "${{ needs.firmware.outputs.version }}" \
            --version-code "${{ needs.firmware.outputs.version_code }}" --commit "${{ needs.firmware.outputs.ref }}"
          echo "desktop (${{ matrix.name }}): $(ls out | grep -v json)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the package
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.name }}
          path: out/
          if-no-files-found: error

      # ANY FAIL = STOP (Brad, 2026-10-27: "the gate stops matrix 2 ... any fail = stop"): needs: keeps every later
      # job from starting, but a failed job does not stop the one running beside it - so the run is cancelled, and
      # the other jobs of its stage end with it. Not under act (no run to cancel).
      - name: Stop the run - this job failed
        if: failure() && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  webapp:
    needs: [trigger, firmware, android, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ok-edge
        uses: actions/checkout@v5
        with:
          path: ok-edge
          # the release commit (the version bump), not the push's latest
          ref: ${{ needs.firmware.outputs.ref }}

      - name: Checkout test-moniker
        uses: actions/checkout@v5
        with:
          repository: bmatusiak/test-moniker
          path: test-moniker

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The hexes into firmware/
        uses: actions/download-artifact@v5
        with:
          name: firmware
          path: ok-edge/firmware

      # the Downloads page offers the prod hex alone; the test hex is in the GitHub release only
      - name: Only the prod hex for the web app
        working-directory: ok-edge
        run: node tools/firmware.js prod-only firmware

      - name: Install ok-edge's packages
        working-directory: ok-edge
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci --no-audit --no-fund

      # wrangler's build command (mcp-server/build-webapp.js) builds the RELEASE web app into docs/ (CI is set) and
      # copies the prod hex to docs/firmware; --dry-run then bundles the Worker into worker-out/ and deploys nothing.
      # What the Downloads page lists is the release manifest (docs/release.json), written by publish over every part.
      - name: Build the web app and bundle the Worker
        working-directory: ok-edge
        run: |
          npx --yes "wrangler@$(node -p "require('./package.json').scripts['server:dev'].match(/wrangler@([\d.]+)/)[1]")" deploy --dry-run --outdir worker-out

      # WHAT A RELEASE MUST NOT CARRY, as the APK's and the desktop packages' checks: a development export (Expo names its
      # bundle by the hash of nothing - __DEV__ on: testing mode, Login Bypass), the testing screen in the bundle, a soft
      # key build record with the debugging lock off (the red TEST BUILD banner)
      - name: Release checks
        working-directory: ok-edge
        run: |
          set -euo pipefail
          bad=0
          ls docs/_expo/static/js/web/*.js >/dev/null
          if ls docs/_expo/static/js/web/ | grep -q d41d8cd98f00b204e9800998ecf8427e; then echo "::error::docs/ is a development export"; bad=1; fi
          if grep -qa 'Soft Key firmware' docs/_expo/static/js/web/*.js; then echo "::error::the testing screen is in the web app"; bad=1; fi
          if [ -f src/generated/firmware.json ] && node -e "process.exit(require('./src/generated/firmware.json').debugLock === false ? 0 : 1)"; then echo "::error::the debugging lock is off"; bad=1; fi
          if ls docs/firmware | grep -q '^DANGEROUS-'; then echo "::error::the test hex is on the web app"; bad=1; fi
          [ $bad = 0 ]
          echo "web app release checks: release export, no testing screen, debugging lock on, the prod hex alone" >> "$GITHUB_STEP_SUMMARY"

      # a pre-release's site is a Worker of its own (ok-edge-pre-release): its branch must never deploy over the published one
      - name: Assemble the site
        working-directory: ok-edge
        env:
          KIND: ${{ needs.trigger.outputs.kind }}
        run: node tools/release/cloudflare-site.js --docs docs --worker worker-out --out ../site --kind "${KIND:-build}"

      - name: Upload the site
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: site/
          if-no-files-found: error

      # ANY FAIL = STOP (Brad, 2026-10-27: "the gate stops matrix 2 ... any fail = stop"): needs: keeps every later
      # job from starting, but a failed job does not stop the one running beside it - so the run is cancelled, and
      # the other jobs of its stage end with it. Not under act (no run to cancel).
      - name: Stop the run - this job failed
        if: failure() && !env.ACT
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  # A PRE-RELEASE OR A RELEASE (the trigger's kind): a GitHub prerelease + the cloudflare-pre-release branch, or a GitHub
  # release + the cloudflare branch - the published site, which takes releases only.
  publish:
    if: needs.trigger.outputs.kind == 'prerelease' || needs.trigger.outputs.kind == 'release'
    needs: [trigger, firmware, gate, android, desktop, webapp]
    # one publish at a time: two would race for the tag and the branch (never cancelled - it waits)
    concurrency:
      group: release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.firmware.outputs.tag }}
      KIND: ${{ needs.trigger.outputs.kind }}
      # where the site goes: the published site (cloudflare) takes releases only
      BRANCH: ${{ needs.trigger.outputs.kind == 'release' && 'cloudflare' || 'cloudflare-pre-release' }}
      # the commit released: the one the trigger named (the pushed commit)
      RELEASE_SHA: ${{ needs.trigger.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # the release manifest's writer, from the commit released (nothing else of the tree is needed here)
      - name: Checkout the release tools
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.trigger.outputs.ref }}
          path: ok-edge
          sparse-checkout: tools/release

      # THE RELEASE MANIFEST (Brad, 2026-11-04: "the publish step should create a final manifest"): one record of every
      # part this run built - docs/release.json (served at /release.json) and the branch's README from it. It refuses a
      # part whose soft key carries other fixes than the firmware record, so nothing is published from such a run.
      - name: The release manifest
        run: |
          node ok-edge/tools/release/release-manifest.js --artifacts artifacts --site artifacts/site --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --version "${{ needs.firmware.outputs.version }}" --code "${{ needs.firmware.outputs.version_code }}" \
            --commit "$RELEASE_SHA" --run "$GITHUB_RUN_ID" --kind "$KIND"

      - name: The GitHub prerelease or release (APK, desktop packages, hex, release.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls artifacts/android/*.apk)
          win=$(ls artifacts/desktop-windows/*.zip)
          linux=$(ls artifacts/desktop-linux/*.tar.gz)
          fw() { node -p "const b = require('./artifacts/firmware/manifest.json').builds.find((x) => x.flavor === '$1'); $2"; }
          prod=artifacts/firmware/$(fw prod b.file)
          test=artifacts/firmware/$(fw test b.file)
          {
            echo "A $KIND, built by the release workflow (run $GITHUB_RUN_ID) from main ${RELEASE_SHA:0:7}."
            echo
            if [ "$KIND" = release ]; then
              echo "- Android app: $(basename "$apk") - com.okedge, signed by red-key's RSA3 (the official certificate)"
            else
              echo "- Android app: $(basename "$apk") - com.okedge.debug (OnlyKey DEBUG, installs beside the release), signed with the repo debug keystore"
            fi
            echo "  sha256 $(node -p "require('./artifacts/android/manifest.json').sha256")"
            echo "  signing certificate SHA-256 $(node -p "require('./artifacts/android/manifest.json').certSha256")"
            echo "- Desktop app for Windows (x64, unzip and run ok-edge.exe; not code-signed): $(basename "$win")"
            echo "  sha256 $(node -p "require('./artifacts/desktop-windows/desktop-windows.json').sha256")"
            echo "- Desktop app for Linux (x64, unpack and run ./ok-edge): $(basename "$linux")"
            echo "  sha256 $(node -p "require('./artifacts/desktop-linux/desktop-linux.json').sha256")"
            echo "- Firmware for a developer key (unsigned), prod - no debug console: $(basename "$prod")"
            echo "  sha256 $(fw prod b.sha256)"
            echo "- Firmware for a developer key (unsigned), TEST - debug console: $(basename "$test") - $(fw test "b.tested ? 'tested: ' + b.testedOn : 'not yet tested on a hard key'")"
            echo "  sha256 $(fw test b.sha256)"
            echo "  WARNING: the test firmware exposes debugging - its console prints key data. Never use it with live"
            echo "  credentials and never restore a backup to it: it would expose them. For test keys only."
          } > notes.md
          gh release create "$TAG" "$apk" "$win" "$linux" "$prod" "$test" artifacts/site/docs/release.json --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" $([ "$KIND" = prerelease ] && echo --prerelease) --title "$TAG" --notes-file notes.md

      # the built site, one commit per release on its branch (created on its first run)
      - name: The site onto its branch (cloudflare or cloudflare-pre-release)
        run: |
          set -euo pipefail
          git init --quiet branch
          cd branch
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          if git fetch --quiet --depth 1 origin "$BRANCH"; then git checkout --quiet -B "$BRANCH" FETCH_HEAD; else git checkout --quiet --orphan "$BRANCH"; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../artifacts/site/. .
          # the release manifest at the branch root too, as a link to the one file (Brad: "symlink to that")
          ln -sfn docs/release.json release.json
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit --quiet -m "$TAG: the built site from main ${RELEASE_SHA:0:7} (release workflow run $GITHUB_RUN_ID)"
          git push --quiet origin "$BRANCH"
          echo "$BRANCH branch: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # Cloudflare deploys each branch on its own when it is pushed (above). With a CLOUDFLARE_API_TOKEN secret the
      # workflow would deploy the published site too - a release only: wrangler.json names the published Worker, and a
      # pre-release must never land on it. The repo holds no token, so this step only says so.
      - name: Deploy (with a CLOUDFLARE_API_TOKEN secret)
        if: env.KIND == 'release'
        working-directory: branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "no CLOUDFLARE_API_TOKEN secret - not deployed; the cloudflare branch holds the site" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes "wrangler@$(node -p "require('./package.json').devDependencies.wrangler")" deploy
          echo "deployed to Cloudflare" >> "$GITHUB_STEP_SUMMARY"
