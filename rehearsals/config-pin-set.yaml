# CONFIG MODE, ONE WRITE IN IT: the second-profile PIN set to PIN2 (config-pin.yaml runs this twice: the new PIN, then
# the old one put back). In (config-in.yaml, each step checked), the write - a PIN only config mode allows, pressed on the
# key's own buttons (HardKeySetupScreen) - and out (config-out.yaml: the key restarted, forgotten, config mode off).
# FIRMWARE NOTE (box, 2026-11-03): setting the second-profile PIN makes the key a new random nonce2, which the primary
# profile's key is masked with too - the primary PIN still unlocks, but its keys and identity come out different (seen:
# 9da6d2e711b9 -> ec9c61da5839 -> 3bafe0d00eef; okcore.cpp set_secondary_pin, password.cpp profile 1). A test key only.
#   run.js rehearse --app desktop@box config-pin-set --env PIN2=3333333   (on the gadget; config-pin.yaml sets it up)
name: Config mode - in, the second-profile PIN, out
tags:
  - config
---
- runFlow:
    file: config-in.yaml
    env:
      PAGE: PIN Setup
- tapOn: "Change Secondary PIN"
- tapOn: "Start"
- runScript:
    file: scripts/config-pin-press.js
    env:
      PASS: first
- tapOn: "Done - I pressed it"
- runScript:
    file: scripts/config-pin-press.js
    env:
      PASS: again
- tapOn: "Done - I pressed it again"
- assertVisible: "The second-profile PIN is set.*"
- tapOn: "Continue"
- runFlow: config-out.yaml
