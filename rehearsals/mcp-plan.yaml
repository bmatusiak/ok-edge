# An agent's plan, run on this device (the MCP plan, Step 4b). The agent's side runs beside it
# (tools/box/mcp-plan-agent.js <mcp url> <identity>: its card, then a plan of two signs named by their fingerprints, its
# data sent once the plan runs). Here the owner's side: accept the agent in the Edge tab's Agents rows; its card's sheet
# (the agent asks for it, card_new) - Approve, the drive presses the test key to certify it; then the Edge sheet asks one
# budget sized to the plan, showing the fingerprints (its "[tap] wanted" signal) - Approve, one press - the data comes,
# each item signs as one paid use with its receipt, and the plan ends done with its budget ended.
name: Run an MCP plan
tags:
  - agents
  - edge
---
- goto: Edge
# the Agents rows are on the Budgets view (the tab may have been left on Presses)
- tapOn: "Budgets"
- tapOn:
    text: "Accept ${output.agentName || 'mcp-plan-agent'}"
    timeout: 60
# the agent's card (card_new): Approve, then the drive presses the test key to certify it; the done sheet closed
- waitForTap:
    what: 'agent card'
    timeout: 120000
- tapOn: "Approve"
- waitForLog:
    pattern: '\[mcp\] plan \S+: the card .* - done'
    timeout: 120000
- tapOn: "Close"
- waitForTap:
    what: 'budget ask'
    timeout: 120000
- tapOn: "Approve"
- waitForLog: '\[mcp\] plan \S+: budget \d+ open'
- waitForLog:
    pattern: '\[mcp\] plan \S+: (done|ended|failed|declined)'
    timeout: 300000
    # the plan waits, idle, while the agent sends its data: idle is not an end here
    idle: none
