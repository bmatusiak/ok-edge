# A TEST KEY CLEARED AFTER THE TESTING KIT, THEN SET UP BY THE APP (Brad, 2026-11-05: "clear the key after using the
# testing kit, then rehearse the setup on the app"; "i dont want a dirty key being plugged in the app after its been
# hammered in the testing kit"; one PIN in the app, 1234561). The gadget goes off (one OnlyKey on the USB), the app stops
# (it holds the hard key's replies), the kit's 'blank' wipe goes through the key's debug console (tools/box/hardkey-
# clear.js - the userspace wipe), then the app's own Setup tab sets it up as a person would: the PIN pressed on the
# key's buttons twice (scripts/setup-pin-on-key.js), the key unplugged and back, and the login. Test hex only.
#   run.js rehearse --app desktop@box hardkey-setup
name: A test key cleared and set up by the app
tags:
  - config
env:
  PIN: "1234561"
---
- machine:
    action: use-key
    target: webapp
    args:
      key: hard
- runScript: scripts/require-test-key.js
- stopApp
- machine:
    action: tool
    target: firmware
    args:
      name: hardkey-clear.js
- launchApp
# a blank key: the login screen offers its setup (no menu yet)
- tapOn: "Set up this key"
# its Continue goes on to the PINs only once the app reads the key as blank - its options show then
- runScript:
    file: scripts/screen-says.js
    env:
      WANT: "A PIN, and also:"
- tapOn: "Continue"
- tapOn: "Start"
- runScript:
    file: scripts/setup-pin-on-key.js
    env:
      PIN: ${PIN}
- tapOn: "Done - I pressed it"
- runScript:
    file: scripts/setup-pin-on-key.js
    env:
      PIN: ${PIN}
- tapOn: "Done - I pressed it again"
- tapOn: "Continue"
# the replug page: unplugged and back, which ends the key's first-use config mode - it starts locked
- unplugKey
- waitForLog:
    pattern: '\[identity\] the key went \(unplugged\)'
    timeout: 20000
- plugKey
# the unplug forgot the key (as every unplug - identity.forget): the app is back at its Log in page, the setup done
- login:
    pin: ${PIN}
