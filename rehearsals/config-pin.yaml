# CONFIG MODE WORKS AS INTENDED (Brad, 2026-11-03: "need a rehearsal flow to adjust something with config mode, like 2nd
# profile pin from 2222222 to 3333333"; "the purpose of this flow is to check config mode works as intended"). On the
# box's gadget (a test key - an emulated hard key on USB, its second-profile PIN FROM): config mode in, a write only it
# allows (the second-profile PIN set to TO), out (config-pin-set.yaml checks each); then the write is proven - TO
# unlocks the key - and, after a login, config mode is off: the PIN panel is closed to writes again.
# The PIN stays on the key, so FROM is put back when the flow ends, passed or failed (onFlowComplete) - through config
# mode again.
#   run.js rehearse --app desktop@box config-pin [--env FROM=2222222 --env TO=3333333]
name: Config mode works as intended - the second-profile PIN changed and put back
tags:
  - config
  - pin
env:
  FROM: "2222222"
  TO: "3333333"
onFlowComplete:
  # from a key restarted out of config mode, wherever the flow stopped (one that stopped in it left the key there)
  - unplugKey
  - plugKey
  - runFlow:
      file: config-pin-set.yaml
      env:
        PIN2: ${FROM}
---
- machine:
    action: use-key
    target: webapp
    args:
      key: gadget
# a key restarted first: out of config mode, whatever a run before left it in
- unplugKey
- plugKey
- stopApp
- launchApp
# which key it is before: the login's own identity line
- login: {}
- waitForLog:
    pattern: '\[identity\] [0-9a-f]{12}:'
    as: identityBefore
    timeout: 60000
- runFlow:
    file: config-pin-set.yaml
    env:
      PIN2: ${TO}
# the write took: the new second-profile PIN opens the key - then unplugged and back, locked for the primary PIN
- runScript:
    file: scripts/config-pin-check.js
    env:
      PIN2: ${TO}
- unplugKey
- plugKey
# out of config mode for good: logged in again - the same key (patch 0018: before it, the primary profile came back as
# another key with its FIDO2 blocked) - and the PIN panel needs config mode once more
- login: {}
- waitForLog:
    pattern: '\[identity\] [0-9a-f]{12}:'
    as: identityAfter
    timeout: 60000
- runScript:
    file: scripts/config-same-identity.js
    env:
      WHAT: the second-profile PIN set in config mode
- goto: Settings
- tapOn: "Open PIN Setup"
- assertVisible: "Needs config mode"
