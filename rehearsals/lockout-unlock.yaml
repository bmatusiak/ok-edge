# THE FIRST READS AFTER A LOCKOUT RESTART, THEN AN UNLOCK (Brad, 2026-11-04 20:11, red-key on Windows, twice that day:
# the idle lockout restarted the key at 13:31, it sat locked, the unlock at 20:11 - then the identity read had "no answer
# in 30000 ms" twice and a reply that failed transit authentication). On a test key: logged in, the key off the USB and
# back as the lockout's restart is (its own restart, locked), then the login's unlock and the identity read - which must
# answer. A failed key request fails the wait at once.
#   run.js rehearse --app desktop@box lockout-unlock
name: The first reads after a lockout restart
tags:
  - key
---
- runScript: scripts/require-test-key.js
- login: {}
- unplugKey
- waitForLog:
    pattern: '\[identity\] the key went'
    timeout: 20000
- plugKey
- waitForLog:
    pattern: '\[hardkey\] state: locked'
    timeout: 20000
- login: {}
- waitForLog:
    pattern: '\[timeline\] \d+ end #\d+ .* steps=\d+ ok'
    timeout: 70000
