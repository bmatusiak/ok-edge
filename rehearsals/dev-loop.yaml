# THE AIR-GAPPED DEV LOOP (the plan's step 4): this computer's desktop app on its testnet soft key, its own local MCP, and
# a scripted agent - one command, no internet: run.js rehearse --app desktop@box dev-loop. The plan itself is plan-run's
# (an agent's plan of one sign and one placeholder, accepted, approved with one press, signed, done). The safety net for
# the structure track: every piece of the MCP plan, end to end, in one run.
name: The air-gapped dev loop
tags:
  - agents
  - edge
---
# the box's gadget off the USB first: while it is there the desktop takes it as its key (the web app's key, not this
# desktop's soft key) - on again at the end
- machine:
    action: use-key
    target: webapp
    args:
      key: hard
# started again with no USB key: it comes up on its soft key
- stopApp
- launchApp
# the desktop's own testnet soft key - its own chain, its local MCP
- login:
    key: soft
- runFlow: plan-run.yaml
- machine:
    action: use-key
    target: webapp
    args:
      key: gadget
