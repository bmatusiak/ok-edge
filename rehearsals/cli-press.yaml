# A CLI'S PRESS ON THIS APP'S SHEET (Brad, 2026-11-02: the agent identity's certificate waited for presses through the
# desktop app with no sheet, and its code reached him only through a terminal): the CLI asks the key through this app;
# the sheet inspector checks each press came on a sheet showing its code, and went when the key answered. Any app with
# a test key on its USB - the drive presses it when the sheet asks. Testnet only.
#   run.js rehearse --app desktop@windows cli-press
name: A CLI's press on the app's sheet
tags:
  - edge
  - sheets
---
- runScript: scripts/cli-press-start.js
# APPROVED IN THE APP FIRST, THEN THE KEY (Brad, 2026-11-03: "i press approve on the app, and then on the key, like edge"):
# each of the certificate's two signatures asks this app first - what it is for, the message - and only then the key; the
# inspector fails a CLI press that reaches the key with no approval before it, and a press with no sheet or no code
- waitForTap:
    what: 'press ask'
    timeout: 60000
- tapOn: "Approve"
- expectSheets:
    sheets:
      - press: ".*the CLI.*"
    timeout: 60000
- waitForTap:
    what: 'press ask'
    timeout: 60000
- tapOn: "Approve"
# the identity it made, approved on this app's sheet
- waitForTap:
    what: 'agent identity'
    timeout: 120000
- tapOn: "Approve"
- runScript: scripts/setup-end.js
