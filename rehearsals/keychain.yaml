# KEY CHAIN KEEPS EVERY KEY (the structure track S9, 2026-11-02 - the review's Key Chain writer race): the tab's own
# changes go through the recorder's queue as changes to the list as it is then, so a key the soft key records meanwhile
# is not written over. This walks the tab's derive path on the testnet soft key.
appId: com.okrn
name: Key Chain keeps every key
tags:
  - keychain
# the soft keys' testing PIN - login.yaml's own is the hard keys' (a caller's env wins)
env:
  PIN: "1234561"
---
- runFlow: login.yaml
- goto: Key Chain
- waitForAnimationToEnd
# "On this App"'s "+ Add" (the drive lists controls as they registered: index 1 is "On this Key"'s) - its editor
# offers Derive, which the key's does not
- tapOn:
    text: "\\+ Add"
    index: 0
- waitForAnimationToEnd
- assertVisible: "Derive"
# a label of this run's own, so a second run is a new key, not "Already in the App"
- evalScript: '${output.label = "kc-rehearsal-" + Date.now()}'
# the name field, by its placeholder (a field the drive fills: useDriveField)
- inputText:
    text: "${output.label}"
    field: "label (e.g. example.com)"
- tapOn: "Derive and keep"
- assertVisible:
    text: "Derived and kept in the App: ${output.label}\\."
    timeout: 60
- assertVisible: "${output.label}"
- takeScreenshot: keychain-kept
