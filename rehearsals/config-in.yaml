# INTO CONFIG MODE ON A HARD KEY, EACH STEP CHECKED (config-mode.yaml; Brad, 2026-11-03: "check config mode works as
# intended"). From any state: logged in, Settings -> PAGE (where the write is), "I will hold button 6" (the app WANTS it),
# button 6 held - the key locks itself and the app KEEPS the key (a config-mode lock is not a lock that forgets) and says
# "pre"; "Enter config mode" (the Log in button, red) opens the PIN page (testing mode: This Key), the PIN on the key (the app says unlocked), "Check config mode"
# -> "on". Ends back on PAGE, ready for the write.
#   runFlow: {file: config-in.yaml, env: {PAGE: PIN Setup}}
name: Into config mode
tags:
  - config
---
- login: {}
- goto: Settings
- tapOn: "Open ${PAGE}"
- tapOn: "I will hold button 6"
- runScript:
    file: scripts/config-expect.js
    env:
      WANT: wanted
      WHY: the app was told before the hold, so the lock to come is config mode's
- runScript: scripts/config-hold.js
- runScript:
    file: scripts/config-expect.js
    env:
      WANT: pre
      WHY: the key locked on its way in; the app waits for the PIN and the check
# the lock put the app on its Log in page (the key is kept), which says so: its button is "Enter config mode" (red), not
# "Log in" (Brad, 2026-11-03) - it opens the PIN page, where "Check config mode" is. In testing mode (a test build with a
# hard key) the app stays on its main screen instead, and This Key holds the PIN pad and the check.
- runScript: scripts/config-door.js
- runFlow:
    when:
      true: ${output.configDoor === 'login'}
    commands:
      - assertNotVisible: "Log in"
      - tapOn: "Enter config mode"
- runFlow:
    when:
      true: ${output.configDoor === 'main'}
    commands:
      - goto: This Key
- runScript: scripts/config-unlock.js
- tapOn: "Check config mode"
- runScript:
    file: scripts/config-expect.js
    env:
      WANT: "on"
      WHY: the key answered the check - the app may write what only config mode allows
- goto: Settings
- tapOn: "Open ${PAGE}"
