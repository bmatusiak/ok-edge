# THE SHEET CLEARS ON LOGOUT (Brad, 2026-11-04: red-key locked itself on Windows with a budget sheet open, and the Log in
# page sat under the agent card's label, its ssh and gpg identities and the email - "need to clear the sheet on
# logout"; src/ui/Sheet.tsx, src/onlykey.ts tellForgotten). On the box's gadget (a test key): logged in, a sheet open,
# button 3 held - the same lock as the idle lockout - and the app must come to a clean Log in page with no sheet over it.
#   run.js rehearse --app desktop@box sheet-forget
name: The sheet clears on logout
tags:
  - login
---
- machine:
    action: use-key
    target: webapp
    args:
      key: gadget
- stopApp
- launchApp
- login: {}
- goto: Edge
- tapOn: "Open Edge Management"
- assertVisible: "Close Edge Management"
- runScript: scripts/lock-hold.js
- runScript: scripts/sheet-forget-check.js
