# The phone's Bluetooth on, and on at every app start (a fresh install has it off - its key service then does not
# advertise, and no computer's mcp-server can link to it: ok-edge plan B0-B3). Logged in first.
appId: com.okedge.debug
name: Bluetooth on at app start
tags:
  - bluetooth
---
- launchApp
- login: {}
- goto: Bluetooth
- tapOn: "Bluetooth: off"
- tapOn: "Start on app start: off"
- waitForLog: '\[ble\] advertising|advertising FIDO service'
