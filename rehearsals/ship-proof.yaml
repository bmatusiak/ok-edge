# THE PLAN SHIP, PROVEN ON THE TESTNET BEFORE RED-KEY (S7 step 1; Brad, 2026-11-02: the batches start with 1): the box's
# scratch repo (one unsigned commit, its remote the box's own ssh server, pinned for the testnet only - ssh-pins.json)
# shipped as batch 1 would be - `edge control ship --max 1` through this desktop's testnet soft key: the plan shown, one
# budget, the drive's press, the signature, the push, each receipt with its result, the end.
#   run.js rehearse --app desktop@box ship-proof
name: The plan ship on the testnet
tags:
  - edge
  - ship
---
- runFlow: desktop-soft-key.yaml
- runScript: scripts/ship-start.js
# the budget request reaches this app's Edge sheet: Approve, and the drive presses the test key once
- waitForTap:
    what: 'budget ask'
    timeout: 120000
- tapOn: "Approve"
- runScript: scripts/ship-end.js
- machine:
    action: use-key
    target: webapp
    args:
      key: gadget
