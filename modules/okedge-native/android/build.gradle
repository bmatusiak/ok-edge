apply plugin: "com.android.library"
// gradle.properties sets android.builtInKotlin=false, as in ok-rn.
apply plugin: "org.jetbrains.kotlin.android"
// Codegen for this library's specs (package.json codegenConfig): the Java specs (com.okrn.specs)
// and the JNI glue autolinking compiles into the app.
apply plugin: "com.facebook.react"

/*
 * ok-edge's native modules, one library copied from ok-rn (the oracle): Random, Kdf, OkSsl, RsaGen,
 * Secrets. ok-rn builds them in its app module plus android/okssl; here they are one autolinked
 * library, because ok-edge's android/ is generated by `expo prebuild` and holds no code of its own.
 *
 * OKSSL: OpenSSL from native-sea-openssl (github.com/bmatusiak/native-sea-openssl), linked
 * statically into libokssl.so through a small JNI library (src/main/cpp/okssl.cpp) - Key Chain's
 * RSA keygen and PBKDF2. THE RELEASE IS PINNED BY VERSION AND SHA-256, the same pin as ok-rn's
 * android/okssl/build.gradle: the zip is fetched once into android/.openssl/<version>/ (git-ignored,
 * beside this file so `expo prebuild --clean` does not throw it away), checked against the hash, and
 * only the release AAR's prefab/ tree is kept. A changed download stops the build. Fetched at
 * configuration time because CMake resolves its project then and needs the headers.
 */
def OPENSSL_RELEASE = "v3.5.9"
def OPENSSL_ZIP_SHA256 = "bd18836567f93a9e6a460cc6997e816274f127fc2027e82fa6aa743ac9507328"

def osslDir = new File(projectDir, ".openssl/${OPENSSL_RELEASE}")
def prefabDir = new File(osslDir, "prefab")
if (!new File(prefabDir, "modules/openssl/libs").exists()) {
    osslDir.mkdirs()
    def zip = new File(osslDir, "native-sea-openssl.zip")
    if (!zip.exists()) {
        def url = "https://github.com/bmatusiak/native-sea-openssl/releases/download/${OPENSSL_RELEASE}/native-sea-openssl.zip"
        logger.lifecycle("okssl: fetching ${url}")
        new URL(url).withInputStream { input -> zip.withOutputStream { it << input } }
    }
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    zip.withInputStream { input ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = input.read(buf)) > 0) digest.update(buf, 0, n)
    }
    def got = digest.digest().encodeHex().toString()
    if (got != OPENSSL_ZIP_SHA256) {
        zip.delete()
        throw new GradleException("okssl: native-sea-openssl ${OPENSSL_RELEASE} zip has sha256 ${got}, expected ${OPENSSL_ZIP_SHA256} - deleted; refusing to link it")
    }
    project.copy {
        from zipTree(zip)
        include "android/native-sea-openssl-release.aar"
        into osslDir
    }
    project.copy {
        from zipTree(new File(osslDir, "android/native-sea-openssl-release.aar"))
        include "prefab/**"
        into osslDir
    }
}

android {
    /* com.okrn: the copies read com.okrn.R (icons, press sounds) and com.okrn.BuildConfig, as in
       ok-rn - this namespace generates exactly those, so they stay byte copies */
    namespace "com.okrn"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    /* com.okrn.BuildConfig.DEBUG (NativeUsbHidModule's TCP transport on an emulator) */
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        externalNativeBuild {
            cmake {
                arguments "-DOKSSL_OPENSSL=${new File(prefabDir, 'modules/openssl').absolutePath.replace('\\', '/')}"
            }
        }
        /* the three ABIs ok-rn builds (okemu/okssl): armeabi-v7a, arm64-v8a, x86_64 */
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    /* NativeSecrets: BiometricPrompt + the Keystore key that makes it mean something (ok-rn's note:
       the key is made with setUserAuthenticationRequired, so the secret cannot be decrypted without one) */
    implementation("androidx.biometric:biometric:1.1.0")
    /* the soft key: node-onlykey-emulator's Android library (com.okrn.okemu.OkEmuNative), included
       by app.plugin.js from the emulator checkout */
    implementation project(':okemu')
}
